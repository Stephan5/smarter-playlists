name: Release

# Pushing a version tag, e.g. v2.1.0, builds the standalone executable and attaches it to a GitHub release
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    # The executable reads the Music library and talks to the Music app, so it can only be built on macOS
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Check the tag matches the version
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "Tag $GITHUB_REF_NAME doesn't match version $version in pyproject.toml" >&2
            exit 1
          fi

      - name: Install
        run: pip install -e . pyinstaller

      - name: Build
        run: pyinstaller --noconfirm smarter-playlists.spec

      - name: Check it runs
        run: dist/smarter-playlists --help

      - name: Package
        run: |
          name="smarter-playlists-$GITHUB_REF_NAME-macos-$(uname -m)"
          mkdir "$name"
          cp dist/smarter-playlists README.md "$name"
          zip -r "$name.zip" "$name"
          shasum -a 256 "$name.zip" > "$name.zip.sha256"
          echo "ASSET=$name.zip" >> "$GITHUB_ENV"

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "$ASSET" "$ASSET.sha256" --title "$GITHUB_REF_NAME" --generate-notes

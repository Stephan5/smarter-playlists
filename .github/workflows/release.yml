name: Release

# Pushing a version tag, e.g. v2.1.0, builds the standalone executable and attaches it to a GitHub release
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  # Nothing is released unless the tests pass on the tagged commit
  test:
    uses: ./.github/workflows/tests.yml

  release:
    needs: test
    # The executable reads the Music library and talks to the Music app, so it can only be built on macOS. Only for
    # Apple Silicon (arm64), which is what macos-latest is. The Intel runners would need a build of their own.
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Check the tag matches the version, and find its release notes
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "Tag $GITHUB_REF_NAME doesn't match version $version in pyproject.toml" >&2
            exit 1
          fi
          # The release's description is its section of the notes, from its heading to the next version's
          awk -v heading="## $version" \
            '$0 == heading {found = 1; next} found && /^## / {exit} found' \
            RELEASE_NOTES.md > "$RUNNER_TEMP/release-notes.md"
          if ! grep -q '[^[:space:]]' "$RUNNER_TEMP/release-notes.md"; then
            echo "RELEASE_NOTES.md has no notes under '## $version'" >&2
            exit 1
          fi
          echo "NOTES=$RUNNER_TEMP/release-notes.md" >> "$GITHUB_ENV"

      - name: Check this is Apple Silicon
        run: |
          if [ "$(uname -m)" != arm64 ]; then
            echo "Expected an arm64 runner, got $(uname -m). The release is named and documented as arm64 only" >&2
            exit 1
          fi

      # The tests of the executable start their own Postgres server, so only need it installed
      - name: Install Postgres
        run: brew install postgresql@18

      # Makes the virtual environment, builds the executable, then runs it as a user would, so a build that's missing
      # something, or a schedule it can't run, is caught before it's released. Slow, as every command takes seconds to
      # start
      - name: Build and test the executable
        run: make binary-test
        timeout-minutes: 20

      - name: Package
        run: |
          name="smarter-playlists-$GITHUB_REF_NAME-macos-arm64"
          mkdir "$name"
          cp dist/smarter-playlists README.md "$name"
          zip -r "$name.zip" "$name"
          shasum -a 256 "$name.zip" > "$name.zip.sha256"
          echo "ASSET=$name.zip" >> "$GITHUB_ENV"

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "$ASSET" "$ASSET.sha256" --title "$GITHUB_REF_NAME" --notes-file "$NOTES"

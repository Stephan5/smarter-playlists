[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "smarter-playlists"
version = "1.0.0"
description = "Build a play history from your Apple Music library in Postgres, and make playlists from it with SQL"
readme = "README.md"
license = "Unlicense"
requires-python = ">=3.14"
dependencies = [
    "psycopg[binary]>=3.2",
    "pyobjc-framework-iTunesLibrary>=10.0; sys_platform == 'darwin'",
]

[project.urls]
Homepage = "https://github.com/Stephan5/smarter-playlists"

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.scripts]
smarter-playlists = "smarter_playlists.__main__:main"

[tool.setuptools]
packages = ["smarter_playlists"]

[tool.setuptools.package-data]
smarter_playlists = ["*.sql", "*.js", "migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "binary: runs the standalone executable, as a user would, using a temporary database. Run with --binary PATH, or `make binary-test`, which builds it first",
    "music: reads the real Music library and talks to the Music app, read-only. Run with --music, or `make music-test`",
    "music_write: makes test playlists and folders in the Music app, then deletes them. Run with --music-write, or `make music-write-test`",
]
